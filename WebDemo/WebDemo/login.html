<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - SuperStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#ff7e5f',
                            DEFAULT: '#f953c6',
                            orange: '#ff6a00',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">

    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2 mb-6 cursor-pointer group">
                <div class="w-12 h-12 bg-gradient-to-br from-brand-orange to-brand-DEFAULT rounded-xl flex items-center justify-center text-white font-bold text-2xl shadow-lg group-hover:scale-105 transition-transform">
                    24
                </div>
                <span class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-orange to-brand-DEFAULT">SuperStore</span>
            </a>
            <h2 id="auth-title" class="text-2xl font-bold text-gray-800">Đăng nhập hệ thống</h2>
            <p class="text-sm text-gray-500 mt-2">Vui lòng điền thông tin để tiếp tục</p>
        </div>

        <!-- Cảnh báo lỗi ẩn mặc định -->
        <div id="login-error" class="hidden bg-red-50 text-red-500 text-sm p-3 rounded-lg mb-6 border border-red-100 flex items-center gap-2">
            <i class="fas fa-exclamation-circle"></i> Sai tên đăng nhập hoặc mật khẩu!
        </div>

        <!-- FORM ĐĂNG NHẬP -->
        <div id="login-form-container">
            <form onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tài khoản</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400"></i>
                        </div>
                        <input type="text" id="username" required placeholder="Nhập tên đăng nhập" 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition-all">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
                        <a href="javascript:void(0)" onclick="toggleForgotMode()" class="text-xs text-brand-orange hover:underline">Quên mật khẩu?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" required placeholder="Nhập mật khẩu" 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition-all">
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-brand-orange to-brand-DEFAULT text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all">
                    Đăng nhập
                </button>
            </form>

            <!-- Gợi ý tài khoản test 3 vai trò -->
            <div class="mt-4 pt-4 border-t border-gray-100">
                <p class="text-xs text-gray-500 font-semibold mb-2">Tài khoản demo 3 vai trò chính:</p>
                <div class="grid grid-cols-3 gap-2 text-center text-xs">
                    <button type="button" onclick="fillDemo('quanly','123')" class="p-2 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-lg border border-purple-200 font-medium transition-colors">
                        👑 Quản lý<br><span class="text-[10px] text-gray-500 font-mono">quanly / 123</span>
                    </button>
                    <button type="button" onclick="fillDemo('nhanvien','123')" class="p-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg border border-blue-200 font-medium transition-colors">
                        👤 Nhân viên<br><span class="text-[10px] text-gray-500 font-mono">nhanvien / 123</span>
                    </button>
                    <button type="button" onclick="fillDemo('khachhang','123')" class="p-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-lg border border-emerald-200 font-medium transition-colors">
                        🛒 Khách hàng<br><span class="text-[10px] text-gray-500 font-mono">khachhang / 123</span>
                    </button>
                </div>
            </div>

            <div class="mt-4 text-center text-sm text-gray-600">
                Chưa có tài khoản? <a href="#" onclick="toggleAuthMode()" class="text-brand-orange font-semibold hover:underline">Đăng ký ngay</a>
            </div>
        </div>

        <!-- FORM ĐĂNG KÝ -->
        <div id="register-form-container" class="hidden">
            <form onsubmit="handleRegister(event)" class="space-y-4">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Họ và Tên</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-id-card text-gray-400"></i>
                        </div>
                        <input type="text" id="reg-fullname" required placeholder="Ví dụ: Nguyễn Văn A" 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tài khoản</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user-plus text-gray-400"></i>
                        </div>
                        <input type="text" id="reg-username" required placeholder="Tên đăng nhập" 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="reg-password" required placeholder="Tạo mật khẩu" 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Đăng ký với vai trò</label>
                    <select id="reg-role" required class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition-all text-gray-700 font-medium">
                        <option value="Customer">🛒 Khách hàng (Customer)</option>
                        <option value="Staff">👤 Nhân viên (Staff)</option>
                        <option value="Manager">👑 Quản lý (Manager)</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all mt-4">
                    Đăng ký tài khoản
                </button>
            </form>
            <div class="mt-6 text-center text-sm text-gray-600">
                Đã có tài khoản? <a href="#" onclick="toggleAuthMode()" class="text-indigo-600 font-semibold hover:underline">Đăng nhập</a>
            </div>
        </div>

        <!-- FORM QUÊN MẬT KHẨU -->
        <div id="forgot-form-container" class="hidden">
            <form onsubmit="handleForgotPassword(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập, Email hoặc SĐT</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-id-badge text-gray-400"></i>
                        </div>
                        <input type="text" id="forgot-identifier" required placeholder="Nhập username, SĐT hoặc email" 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu mới</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-key text-gray-400"></i>
                        </div>
                        <input type="password" id="forgot-newpassword" required placeholder="Nhập mật khẩu mới" 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Xác nhận mật khẩu mới</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-check-double text-gray-400"></i>
                        </div>
                        <input type="password" id="forgot-confirmpassword" required placeholder="Nhập lại mật khẩu mới" 
                               class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-orange/50 transition-all">
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all mt-4">
                    Đặt lại mật khẩu
                </button>
            </form>
            <div class="mt-6 text-center text-sm text-gray-600">
                <a href="#" onclick="showLoginForm()" class="text-brand-orange font-semibold hover:underline">← Quay lại đăng nhập</a>
            </div>
        </div>

    </div>

    <!-- Fix cache issue by forcing new version of script -->
    <script src="./js/auth.js?v=3"></script>
    <script>
        function fillDemo(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        // Redirect to dashboard if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const currentUserStr = sessionStorage.getItem('currentUser');
            if (currentUserStr) {
                const user = JSON.parse(currentUserStr);
                if (user.role === 'Admin' || user.role === 'Manager' || user.role === 'Quản lý') window.location.href = 'admin.html';
                else if (user.role === 'Staff' || user.role === 'Nhân viên') window.location.href = 'staff.html';
                else window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
